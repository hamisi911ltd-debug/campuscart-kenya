    <!-- Site navigation hint for Google Sitelinks. This is a hint, not a
         guarantee — Google decides on its own whether/when to surface
         sitelinks under the main search result, based on site structure and
         search demand for the brand. Deliberately lists only indexable,
         content-rich pages (home, categories) rather than sign-in-gated
         pages like Cart/Orders, which are noindexed and would never
         actually qualify as sitelinks anyway. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SiteNavigationElement",
      "name": ["Home", "All Categories", "Electronics", "Fashion", "Home & Furniture", "Food", "Property", "Books", "Stationery"],
      "url": [
        "https://campusmart.co.ke/",
        "https://campusmart.co.ke/categories",
        "https://campusmart.co.ke/category/electronics",
        "https://campusmart.co.ke/category/fashion",
        "https://campusmart.co.ke/category/furniture",
        "https://campusmart.co.ke/category/food",
        "https://campusmart.co.ke/category/hostels",
        "https://campusmart.co.ke/category/books",
        "https://campusmart.co.ke/category/stationery"
      ]
    }
    </script>

    <!-- FAQ Schema: genuine, evergreen answers about the store itself. Note:
         Google currently limits the visual FAQ accordion in web search
         results to a narrow set of authoritative sites, so this mainly
         helps Google's own understanding of the page rather than
         guaranteeing extra lines under the search result. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What can I buy on CampusMart Kenya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Electronics, fashion, books, food, home & furniture, stationery and property listings, all in one online marketplace serving customers across Kenya."
          }
        },
        {
          "@type": "Question",
          "name": "How do I pay on CampusMart Kenya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CampusMart accepts M-Pesa, cash on delivery and bank transfer, with secure checkout and delivery tracking on every order."
          }
        },
        {
          "@type": "Question",
          "name": "Does CampusMart deliver across Kenya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CampusMart delivers to Nairobi, Mombasa, Kisumu and other locations across Kenya."
          }
        }
      ]
    }
    </script>
