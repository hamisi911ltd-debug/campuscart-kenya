    <!-- Website Schema -->

      "name": "Urban Store Kenya",
      "url": "https://urbanstore.co.ke",
      "description": "Urban Store Kenya - Shop Local. Live Better. Buy and sell online across Kenya",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://urbanstore.co.ke/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Marketplace Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Urban Store Kenya",
      "url": "https://urbanstore.co.ke",
      "description": "Online store for electronics, textbooks, fashion, food, furniture and rooms across Kenya",
      "currenciesAccepted": "KES",
      "paymentAccepted": "M-Pesa, Cash, Bank Transfer",
      "priceRange": "KES 50 - KES 500,000",
      "areaServed": {
        "@type": "Country",
        "name": "Kenya"
      }
    }
    </script>

    <!-- Site navigation hint for Google Sitelinks. This is a hint, not a
         guarantee — Google decides on its own whether/when to surface
         sitelinks under the main search result, based on site structure and
         search demand for the brand. Deliberately lists only indexable,
         content-rich pages (home, categories) rather than sign-in-gated
         pages like Cart/Orders, which are noindexed and would never
         actually qualify as sitelinks anyway. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SiteNavigationElement",
      "name": ["Home", "All Categories", "Electronics", "Fashion", "Home & Furniture", "Food", "Property", "Books", "Stationery"],
      "url": [
        "https://urbanstore.co.ke/",
        "https://urbanstore.co.ke/categories",
        "https://urbanstore.co.ke/category/electronics",
        "https://urbanstore.co.ke/category/fashion",
        "https://urbanstore.co.ke/category/furniture",
        "https://urbanstore.co.ke/category/food",
        "https://urbanstore.co.ke/category/hostels",
        "https://urbanstore.co.ke/category/books",
        "https://urbanstore.co.ke/category/stationery"
      ]
    }
    </script>
